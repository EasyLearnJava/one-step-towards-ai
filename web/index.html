<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learning agentic applications, one step at a time.">
  <title>One Step At A Time</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f3f7ff; color: #172554; font-family: system-ui, sans-serif; }
    main { max-width: 46rem; text-align: center; }
    .eyebrow { color: #1d4ed8; font-size: .9rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 1rem 0; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 1.05; }
    p { color: #475569; font-size: clamp(1.1rem, 3vw, 1.4rem); line-height: 1.6; }
    button { margin-top: 1rem; padding: .8rem 1.6rem; border: 0; border-radius: .6rem; background: #1d4ed8; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #1e40af; }
    button:disabled { opacity: .6; cursor: wait; }
    #reply { min-height: 3.2em; color: #172554; }
    #reply.error, #answer.error { color: #b91c1c; }
    .ask { margin-top: 2.5rem; text-align: left; }
    .ask label { display: block; font-weight: 700; }
    textarea { display: block; width: 100%; margin-top: .5rem; padding: .8rem; border: 1px solid #94a3b8; border-radius: .6rem; font: inherit; resize: vertical; }
    #answer { min-height: 3.2em; color: #172554; white-space: pre-wrap; }
    .note { font-size: .9rem; }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <span class="eyebrow">Learning agentic applications</span>
    <h1>One Step At A Time</h1>
    <p>From curiosity to capable AI agents&mdash;one step at a time.</p>
    <button id="hello" type="button">Say hello to the API</button>
    <p id="reply" aria-live="polite"></p>
    <section class="ask">
      <label for="question">Ask a question</label>
      <textarea id="question" rows="3" maxlength="1000" placeholder="For example: what is RAG?"></textarea>
      <button id="ask" type="button">Ask</button>
      <p id="answer" aria-live="polite"></p>
      <p class="note">Answers come from an AI model and can be wrong.</p>
    </section>
  </main>
</body>
</html>
